<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Портфолио</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

<header>
  <nav>
    <ul>
      <li><a href="#home">Главная</a></li>
      <li><a href="#skills">Навыки</a></li>
      <li><a href="#education">Образование</a></li>
      <li><a href="#achievements">Достижения</a></li>
      <li><a href="#projects">Проекты</a></li>
      <li class="dropdown">
        <a href="#">Мини-игры ▼</a>
        <ul class="dropdown-menu">
          <li><a href="#clicker">Кликер</a></li>
          <li><a href="#adventure">Генератор</a></li>
          <li><a href="#guess">Угадай число</a></li>
        </ul>
      </li>
      <li><a href="#contacts">Контакты</a></li>
    </ul>
  </nav>
</header>

<section id="home" class="hero">
  <h1>Привет, я Студент</h1>
  <p>Frontend разработчик | Студент</p>
  <img src="assets/avatar.jpg" class="avatar">
</section>

<section id="clicker">
  <h2>Кликер</h2>
  <p>Очки: <span id="score">0</span></p>
  <p>Время: <span id="time">30</span></p>
  <button id="clickBtn">Клик!</button>
  <button id="resetBtn">Сброс</button>
</section>

<section id="adventure">
  <h2>Генератор приключений</h2>
  <button onclick="generateAdventure()">Сгенерировать</button>
  <p id="adventureText"></p>
</section>

<section id="guess">
  <h2>Угадай число</h2>
  <input type="number" id="guessInput" min="1" max="100">
  <button onclick="checkGuess()">Проверить</button>
  <p id="guessResult"></p>
</section>

</body>
</html>
